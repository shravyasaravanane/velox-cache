# Test profile: a fresh in-memory H2 database (not the file-backed one application.yml
# points at, so tests never touch or depend on real seeded data) and a tiny seed count, so
# the whole suite starts in well under a second instead of minutes.
spring:
  datasource:
    url: jdbc:h2:mem:velox-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver

velox:
  demo:
    seed-products: 50
    db-latency-ms: 0
    # Large enough that the background @Scheduled flush never fires during a test run, so
    # tests that call WriteBehindBuffer.flush() explicitly get a deterministic, single flush.
    write-behind-flush-ms: 600000
    # Short, so tests can wait out the delay directly instead of mocking the clock.
    double-delete-delay-ms: 150
