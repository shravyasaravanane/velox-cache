# Default profile: H2, embedded, file-backed so the seeded catalog survives a restart
# instead of re-seeding 1,000,000 rows every time the app starts. MODE=PostgreSQL makes H2
# behave enough like Postgres (syntax, type coercion) that schema.sql runs unmodified
# against either -- see application-postgres.yml for the real thing.
spring:
  application:
    name: velox-server
  datasource:
    url: jdbc:h2:file:./data/velox-demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none        # schema.sql owns the schema; see its own header comment for why
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

# This application's own configuration -- see each consumer's Javadoc for why it exists:
# DataSeeder (seed-products, seed-random-seed), CatalogQueryService (db-latency-ms),
# CacheConfig (cache-capacity, cache-policy), CacheVariants (ab-policies),
# ProductCacheService (double-delete-delay-ms), LiveStatsConfig (hll-precision, top-k),
# PolicyArena (arena-capacity, arena-policies) and InternalsVisualizer (visualizer-capacity).
# write-behind-flush-ms defaults to 2000 in WriteBehindBuffer itself, so it is only listed
# here to be easy to find.
velox:
  demo:
    seed-products: 1000000
    seed-random-seed: 42
    db-latency-ms: 25
    cache-capacity: 10000
    cache-policy: W_TINY_LFU
    # The policies GET /api/products/{id}?cache=... can compare, alongside the always-present
    # "off" (bypass caching entirely). Each gets its own independent cache instance, all sized
    # from cache-capacity.
    ab-policies: LRU,ARC,W_TINY_LFU
    # HyperLogLog precision (14 -> ~0.8% error, 16 KB) and how many hot keys Space-Saving
    # tracks -- both drive the dashboard's Hot Keys panel (M6.5).
    hll-precision: 14
    top-k: 10
    # The Policy Arena (M6.4): every listed policy races the same live traffic in its own
    # key-only shadow cache, independent of cache-capacity/cache-policy above.
    arena-capacity: 1000
    arena-policies: LRU,FIFO,RANDOM,CLOCK,LFU,LFU_AGED,SLRU,TWO_Q,LRU_K,ARC,W_TINY_LFU
    # The Internals Visualizer (M6.3): kept small deliberately, so LRU/ARC/W-TinyLFU's
    # structure stays legible as boxes on screen rather than an unreadable wall of nodes.
    visualizer-capacity: 8

logging:
  level:
    com.velox: INFO
